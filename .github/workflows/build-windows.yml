name: Windows EXE

on:
  push:
    paths:
      - "mailconv/**"
      - "tests/**"
      - "mailconv_gui.pyw"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacija
        run: pip install -r requirements.txt pyinstaller pytest
      - name: PST podrska (opciono)
        run: pip install libpff-python
        continue-on-error: true
      - name: Testovi
        run: python -m pytest -q tests
      - name: GUI selftest
        run: python mailconv_gui.pyw --selftest
      - name: PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name mailconv --hidden-import pypff --collect-submodules mailconv mailconv_gui.pyw
      - name: EXE selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\mailconv.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest exit code $($p.ExitCode)" }
          "EXE OK, velicina: {0:N1} MB" -f ((Get-Item dist\mailconv.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: mailconv-windows
          path: dist/mailconv.exe
